services:
  postgres-auth:
    image: postgres:15
    container_name: postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
  sqlserver-residence:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sqlserver-residence
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Residence@2024!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Residence@2024! -Q 'SELECT 1' -No" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5555:5555"
    depends_on:
      postgres-auth:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://postgres:postgres@postgres-auth:5432/auth_db

  residence-service:
    build:
      context: ./residence-service
      dockerfile: Dockerfile
    container_name: residence-service
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      sqlserver-residence:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver-residence;Database=residencias_db;User Id=sa;Password=Residence@2024!;TrustServerCertificate=True

  residence-client:
    build:
      context: ./residence-client
      dockerfile: Dockerfile
    container_name: residence-client
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - auth-service
      - residence-service
    environment:
      NEXT_PUBLIC_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_RESIDENCE_URL: http://localhost:5000

volumes:
  postgres_auth_data:
  sqlserver_data:

