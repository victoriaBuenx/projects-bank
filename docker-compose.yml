services:
  postgres-auth:
    image: postgres:15
    container_name: postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./postgres-init/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - residencias-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
  sqlserver-residence:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: sqlserver-residence
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Residence@2024!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - residencias-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Residence@2024! -Q 'SELECT 1' -No" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - residencias-network
    depends_on:
      postgres-auth:
        condition: service_healthy

  residence-service:
    build:
      context: ./residence-service
      dockerfile: Dockerfile
    container_name: residence-service
    restart: unless-stopped
    ports:
      - "5000:8080"
    networks:
      - residencias-network
    depends_on:
      sqlserver-residence:
        condition: service_healthy
      minio:
        condition: service_healthy

    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver-residence;Database=residencias_db;User Id=sa;Password=Residence@2024!;TrustServerCertificate=True

  residence-client:
    build:
      context: ./residence-client
      dockerfile: Dockerfile
    container_name: residence-client
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - residencias-network
    depends_on:
      - auth-service
      - residence-service
    environment:
      NEXT_PUBLIC_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_RESIDENCE_URL: http://localhost:5000

  mysql:
    image: mysql:8.0
    container_name: mysql-replica
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - residencias-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  symmetricds:
    build: ./symmetricds
    container_name: symmetricds
    volumes:
      - ./symmetricds/engines:/opt/symmetricds/engines
      - ./symmetricds/config/symmetric-server.properties:/opt/symmetricds/conf/symmetric-server.properties
      - ./symmetricds/config/setup-replication.sql:/opt/symmetricds/setup-replication.sql
    depends_on:
      postgres-auth:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - residencias-network

  token-cleaner:
    build:
      context: ./token-cleaner
      dockerfile: Dockerfile
    container_name: token-cleaner
    ports:
      - "3002:3000"
    restart: unless-stopped
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - residencias-network

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    networks:
      - residencias-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:

  postgres_auth_data:
  sqlserver_data:
  mysql_data:
  minio_data:

networks:
  residencias-network:
    driver: bridge
